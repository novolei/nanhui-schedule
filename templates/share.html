<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>{{ name }}的排班 - 南汇店小家电</title>
<!-- Open Graph / WeChat 分享卡片 -->
<meta property="og:title" content="{{ name }}的排班计划（{{ week_label }}）">
<meta property="og:description" content="{% for d in days %}{{ d.label }}:{{ d.shift }} {% endfor %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request_url }}">
<meta property="og:image" content="{{ base_url }}/static/schedule-og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.card{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.1);margin-top:20px}
.header{text-align:center;margin-bottom:20px}
.header .name{font-size:24px;font-weight:700;color:#4a90d9}
.header .week{font-size:14px;color:#999;margin-top:4px}
.header .store{font-size:13px;color:#666;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{text-align:center;padding:8px 4px;border-radius:8px}
.day .label{font-size:12px;color:#999;margin-bottom:4px}
.day .date{font-size:11px;color:#bbb;margin-bottom:4px}
.day .shift{font-size:20px;font-weight:700;line-height:1.2}
.shift-早{background:#d4edff;color:#0050b3}
.shift-晚{background:#ffe7ba;color:#d46b08}
.shift-休{background:#f0f0f0;color:#8c8c8c;font-style:italic}
.shift-全{background:#d9f7be;color:#237804}
.footer{text-align:center;font-size:12px;color:#ccc;margin-top:12px}
.hint{text-align:center;font-size:14px;color:#999;margin-top:12px;padding:8px;background:#f0f5ff;border-radius:8px}
@media(max-width:400px){.card{padding:16px}.day{padding:6px 2px}.day .shift{font-size:16px}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="name">{{ name }}</div>
    <div class="week">{{ week_label }}</div>
    <div class="store">🏪 南汇店小家电</div>
  </div>
  <div class="grid">
    {% for d in days %}
    <div class="day shift-{{ d.shift }}">
      <div class="label">{{ d.label }}</div>
      <div class="date">{{ d.date }}</div>
      <div class="shift">{{ d.shift }}</div>
    </div>
    {% endfor %}
  </div>
  <div class="hint">💡 点击右上角「···」分享给同事</div>
  <div class="footer">南汇店排班系统</div>
</div>
</body>
</html>
