<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>南汇店排班表（{{ week_label }}）</title>
<meta property="og:title" content="南汇店排班表（{{ week_label }}）">
<meta property="og:description" content="南汇店小家电 {{ week_label }} 排班表，共 {{ schedules|length }} 人">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request_url }}">
<meta property="og:image" content="{{ base_url }}/static/schedule-og.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;padding:12px}
.header{text-align:center;padding:16px 0 12px}
.header h1{font-size:20px;font-weight:700;color:#4a90d9}
.header .week{font-size:14px;color:#999;margin-top:4px}
.header .store{font-size:13px;color:#666;margin-top:2px;margin-bottom:8px}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:8px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{background:#f0f5ff;color:#333;font-weight:600;padding:8px 4px;text-align:center;border-bottom:2px solid #e0e8f0}
td{padding:7px 4px;text-align:center;border-bottom:1px solid #f0f0f0}
.name-col{text-align:left;padding-left:10px;font-weight:500;white-space:nowrap;position:sticky;left:0;background:#fff}
.brand-col{font-size:12px;color:#999;text-align:left;padding-left:8px}
.even{background:#f8f9fa}
.shift-早{color:#1890ff;font-weight:700}
.shift-晚{color:#fa8c16;font-weight:700}
.shift-休{color:#bbb}
.shift-全{color:#52c41a;font-weight:700}
.footer{text-align:center;font-size:12px;color:#ccc;margin-top:12px}
.hint{text-align:center;font-size:13px;color:#999;margin:12px 0;padding:8px;background:#f0f5ff;border-radius:8px}
</style>
</head>
<body>
<div class="header">
  <h1>🏪 南汇店小家电排班表</h1>
  <div class="week">📅 {{ week_label }}</div>
  <div class="store">共 {{ schedules|length }} 人</div>
</div>
<div class="grid-wrap">
<table>
<tr>
  <th style="text-align:left;padding-left:10px">姓名</th>
  {% for d in days_cn %}<th>{{ d }}</th>{% endfor %}
</tr>
{% for s in schedules %}
<tr class="{{ 'even' if loop.index is even }}">
  <td class="name-col">{{ s.name }}<br><span style="font-size:11px;color:#999">{{ s.brand }}</span></td>
  {% for shift in s.shifts %}<td class="shift-{{ shift }}">{{ shift }}</td>{% endfor %}
</tr>
{% endfor %}
</table>
</div>
<div class="hint">💡 点击右上角「···」分享或截图保存</div>
<div class="footer">南汇店排班系统</div>
</body>
</html>
