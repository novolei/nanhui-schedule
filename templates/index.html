<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>南汇店小家电排班</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:12px}
.header{background:#4a90d9;color:#fff;padding:14px 16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:18px;font-weight:600}
.header .sub{font-size:12px;opacity:.8;margin-top:2px}
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:52px;z-index:99}
.tab-bar button{flex:1;padding:10px;border:none;background:#fff;font-size:14px;color:#666;cursor:pointer;border-bottom:2px solid transparent}
.tab-bar button.active{color:#4a90d9;border-bottom-color:#4a90d9;font-weight:600}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h3{font-size:15px;margin-bottom:10px;color:#4a90d9}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 18px;border:none;border-radius:6px;font-size:14px;cursor:pointer;gap:4px;text-decoration:none}
.btn-primary{background:#4a90d9;color:#fff}
.btn-success{background:#52c41a;color:#fff}
.btn-danger{background:#ff4d4f;color:#fff}
.btn-warning{background:#faad14;color:#fff}
.btn-outline{background:#fff;border:1px solid #ddd;color:#666}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-block{width:100%;margin-bottom:8px}
.schedule-grid{overflow-x:auto;-webkit-overflow-scrolling:touch}
.schedule-grid table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.rule-tag{display:inline-block;padding:4px 12px;border-radius:16px;font-size:13px;cursor:pointer;transition:all .15s;user-select:none;border:1px solid #d9d9d9}
.rule-tag-avail{background:#fff;color:#333}
.rule-tag-avail:hover{background:#e6f7ff;border-color:#1890ff}
.rule-tag-used{background:#f0f0f0;color:#bbb;cursor:default}
#rulesEditor .rule-tag{margin:2px}
.schedule-grid th,.schedule-grid td{padding:8px 6px;text-align:center;border:1px solid #e8e8e8}
.schedule-grid th{background:#f0f5ff;color:#333;font-weight:600;position:sticky;top:0}
.schedule-grid td{transition:background .15s}
.schedule-grid tbody tr:hover td{background:#fafafa}
.schedule-grid .name-col{text-align:left;padding-left:10px;font-weight:500;white-space:nowrap;background:#fafafa;border-right:2px solid #e8e8e8}
.shift-早{background:#d4edff;color:#0050b3;font-weight:700;border-radius:4px}
.shift-晚{background:#ffe7ba;color:#d46b08;font-weight:700;border-radius:4px}
.shift-休{background:#f0f0f0;color:#8c8c8c;font-style:italic;border-radius:4px}
.shift-全{background:#d9f7be;color:#237804;font-weight:700;border-radius:4px}
.shift-select{cursor:pointer;min-width:28px;display:inline-block;padding:4px 8px;border-radius:6px;transition:all .15s;position:relative}
.shift-select:hover{opacity:.8;transform:scale(1.05)}
.shift-select.selected{border:2px solid #4a90d9;border-radius:6px}
.shift-select.changed::after{content:'•';position:absolute;top:-4px;right:-4px;font-size:16px;color:#ff4d4f;line-height:1;animation:pulse-dot 1s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.shift-select.changed{box-shadow:0 0 0 2px #ff4d4f;border-radius:6px}
.staff-list .staff-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0}
.staff-info{display:flex;align-items:center;gap:8px}
.staff-name{font-weight:500}
.staff-brand{color:#999;font-size:12px}
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-box input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
.search-box input:focus{border-color:#4a90d9}
.my-schedule{text-align:center}
.my-schedule .my-name{font-size:20px;font-weight:700;margin:12px 0}
.my-schedule .my-week{color:#999;font-size:13px;margin-bottom:12px}
.day-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.day-cell{width:60px;padding:6px 0;border-radius:6px;font-size:12px;text-align:center}
.day-label{font-weight:600;color:#666;margin-bottom:2px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-content{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:360px;max-height:80vh;overflow-y:auto}
.modal-content h3{margin-bottom:12px;font-size:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.form-actions{display:flex;gap:8px;margin-top:16px}
.form-actions button{flex:1}
.password-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:20px}
.password-screen h2{margin-bottom:16px;font-size:18px;color:#4a90d9}
.password-screen input{width:100%;max-width:280px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px;text-align:center;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:#999}
.week-picker{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.week-picker label{font-size:13px;color:#666;white-space:nowrap}
.week-picker input[type=date]{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;flex:1;min-width:0}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.action-bar .btn{flex:1;min-width:80px}
.published-badge{font-size:11px;color:#52c41a;background:#f6ffed;padding:2px 8px;border-radius:10px;display:inline-block}
@media(max-width:480px){.schedule-grid table{font-size:12px}.day-cell{width:48px}}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>📋 南汇店排班</h1>
    <div class="sub" id="headerSub">加载中...</div>
  </div>
  <div class="tab-bar" id="tabBar" style="display:none">
    <button class="active" data-tab="view" onclick="switchTab('view')">📅 排班表</button>
    <button data-tab="my" onclick="switchTab('my')">👤 我的排班</button>
    <button data-tab="admin" onclick="switchTab('admin')">⚙️ 管理</button>
  </div>
  <div class="container" id="pageView"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const DAY_KEYS = ['mon_shift','tue_shift','wed_shift','thu_shift','fri_shift','sat_shift','sun_shift'];
const SHIFTS = ['早','晚','休','全'];
const SHIFT_COLORS = {早:'#0050b3',晚:'#d46b08',休:'#8c8c8c',全:'#237804'};
// 排班规则 (管理员可在页面编辑)
let RULES = {
  // 对班组: 一早一晚
  oppositePairs: [['陈磊','刘晓庆']],
  // 同班组: 同班次
  samePairs: [['胡倩','江凤'],['陈梅芳','郭友琴'],['刘晓庆','杨亚男']],
  // 平衡组: 组内早晚平衡
  balanceTeams: [['胡倩','江凤','陈梅芳','郭友琴'],['刘静','倪艺','杨亚男']],
};

let state = { staff:[], schedules:[], publishedWeeks:[], isAdmin:false, tab:'view', editingWeekStart:null, searchName:'', scheduleSnapshot:[] };

// ----- utils -----
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function el(t,c,...ch){const e=document.createElement(t);if(c)for(const k in c)e.setAttribute(k,c[k]);ch.forEach(c=>e.append(c));return e}
function txt(t){return document.createTextNode(t)}

function toast(m,d=2000){
  const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d);
}

function fmtDate(d){const dt=new Date(d);return `${dt.getMonth()+1}月${dt.getDate()}日`}
function getMonday(d){const dt=new Date(d);const day=dt.getDay();const diff=dt.getDate()-day+(day===0?-6:1);const m=new Date(dt);m.setDate(diff);return m.toISOString().slice(0,10)}
function getNextMonday(){const d=new Date();const day=d.getDay();const diff=d.getDate()+(day===0?1:8-day);const m=new Date(d);m.setDate(diff);return m.toISOString().slice(0,10)}

// ----- API -----
async function api(method,path,body){
  const opt={method,headers:{'Content-Type':'application/json'}};
  if(state.isAdmin) opt.headers['X-Admin-Password']=sessionStorage.getItem('admin_pwd')||'';
  if(body) opt.body=JSON.stringify(body);
  const r=await fetch(path,opt);return r.json();
}

async function loadStaff(){state.staff=await api('GET','/api/staff')}
async function loadSchedules(ws){
  state.schedules=await api('GET',`/api/schedules?week_start=${ws}`);
  // Store snapshot for change detection
  state.scheduleSnapshot = state.schedules.map(s => ({
    id: s.id,
    mon_shift:s.mon_shift,tue_shift:s.tue_shift,wed_shift:s.wed_shift,
    thu_shift:s.thu_shift,fri_shift:s.fri_shift,sat_shift:s.sat_shift,sun_shift:s.sun_shift
  }));
}
async function loadPublished(){state.publishedWeeks=await api('GET','/api/publish')}

function switchTab(tab){
  state.tab=tab;
  render();
}

// ----- render -----
function render(){
  const pv=$('#pageView');if(!pv)return;
  $('#tabBar').style.display='flex';
  $$('#tabBar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='view') pv.innerHTML=renderView();
  else if(state.tab==='my') pv.innerHTML=renderMy();
  else if(state.tab==='admin') pv.innerHTML=renderAdmin();
}

function renderView(){
  let h='<div class="week-picker">';
  h+='<label>周:</label>';
  h+=`<input type="date" id="weekPicker" value="${state.editingWeekStart||getNextMonday()}">`;
  h+=`<button class="btn btn-sm btn-primary" onclick="loadWeek()">加载</button>`;
  h+='</div>';
  
  if(state.schedules.length===0){
    h+='<div class="card"><p style="color:#999;text-align:center;padding:20px">暂无排班数据</p></div>';
    return h;
  }
  
  const ws=state.editingWeekStart;
  const d=new Date(ws);
  const dates=[];
  for(let i=0;i<7;i++){const dt=new Date(d);dt.setDate(dt.getDate()+i);dates.push(dt.getDate())}
  
  const pub=state.publishedWeeks.find(p=>p.week_start===ws);
  const isPub=!!pub;
  
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">`;
  h+=`<h3>${fmtDate(ws)} - ${fmtDate(new Date(new Date(ws).getTime()+6*864e5))}</h3>`;
  if(isPub) h+=`<span class="published-badge">✅ 已发布</span>`;
  h+='</div>';
  
  h+='<div class="schedule-grid"><table>';
  h+='<tr><th style="min-width:60px">品牌</th><th style="min-width:60px">姓名</th>';
  for(let i=0;i<7;i++) h+=`<th>${DAYS[i]}<br><span style="font-weight:400;font-size:11px;color:#999">${dates[i]}日</span></th>`;
  h+='</tr>';
  
  for(const s of state.schedules){
    h+=`<tr><td class="name-col" style="font-size:12px;color:#666">${s.brand||'-'}</td><td class="name-col">${s.name}</td>`;
    for(let i=0;i<7;i++){
      const shift=s[DAY_KEYS[i]]||'';
      h+=`<td class="shift-${shift}">${shift||'-'}</td>`;
    }
    h+='</tr>';
  }
  h+='</table></div></div>';

  // Action buttons for view tab
  const ws_enc = encodeURIComponent(ws);
  h+=`<div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-primary" style="flex:1;min-width:100px" onclick="shareFullTeam()">📤 分享团队排班</button>
    <button class="btn btn-success" style="flex:1;min-width:100px" onclick="saveViewScreenshot()">📷 截图排班表</button>
    <button class="btn btn-warning" style="flex:1;min-width:100px" onclick="exportExcel()">📥 导出 Excel</button>
  </div>`;
  return h;
}

function renderMy(){
  let h='<div class="card">';
  h+='<div class="search-box">';
  h+='<select id="searchName" style="flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none" onchange="selectMy(this.value)">';
  h+='<option value="">👤 选择姓名查看排班</option>';
  for(const s of state.staff){
    const sel = s.name === state.searchName ? ' selected' : '';
    h+=`<option value="${s.name}"${sel}>${s.name}${s.brand ? ' ('+s.brand+')' : ''}</option>`;
  }
  h+='</select>';
  h+='</div></div>';
  
  if(!state.searchName){
    h+='<div class="card"><p style="color:#999;text-align:center;padding:20px">请选择姓名查看你的排班计划</p></div>';
    return h;
  }
  
  // find staff
  const st=state.staff.find(s=>s.name===state.searchName);
  if(!st){
    h+='<div class="card"><p style="color:#ff4d4f;text-align:center;padding:20px">未找到该员工</p></div>';
    return h;
  }
  
  // find latest published schedule for this person
  const pubWeeks=state.publishedWeeks.sort((a,b)=>b.week_start.localeCompare(a.week_start));
  if(pubWeeks.length===0){
    h+='<div class="card"><p style="color:#999;text-align:center;padding:20px">暂无已发布的排班</p></div>';
    return h;
  }
  
  // Collect all their schedules across published weeks
  let foundSchedule=null;
  let foundWeek=null;
  for(const pw of pubWeeks){
    const ss=state.schedules.find(s=>s.week_start===pw.week_start && s.staff_id===st.id);
    // Actually we need to load schedules for each published week... 
    // For simplicity, let's just show the latest published week's data which is already loaded
    if(state.editingWeekStart===pw.week_start){
      foundSchedule=state.schedules.find(s=>s.staff_id===st.id);
      foundWeek=pw.week_start;
    }
  }
  
  // If we don't have a matching loaded schedule, try to load the latest published week
  if(!foundSchedule && pubWeeks.length>0){
    // Load data for the latest published week and show
    loadLatestForStaff(st.id, st.name);
    return h;
  }
  
  if(!foundSchedule){
    h+='<div class="card"><p style="color:#999;text-align:center;padding:20px">暂无你的排班数据</p></div>';
    return h;
  }
  
  h+=renderMySchedule(st, foundSchedule, foundWeek);
  return h;
}

async function loadLatestForStaff(staffId, name){
  const pub=state.publishedWeeks.sort((a,b)=>b.week_start.localeCompare(a.week_start));
  if(pub.length===0){toast('暂无已发布的排班');return}
  const ws=pub[0].week_start;
  const data=await api('GET',`/api/schedules?week_start=${ws}`);
  const ss=data.find(s=>s.staff_id===staffId);
  if(!ss){toast('暂无你的排班数据');return}
  state.searchName=name;
  const st=state.staff.find(s=>s.id===staffId);
  const pv=$('#pageView');
  if(st && ss) pv.innerHTML=renderMySchedule(st, ss, ws);
}

function renderMySchedule(st, ss, ws){
  const d=new Date(ws);
  const dates=[];
  for(let i=0;i<7;i++){const dt=new Date(d);dt.setDate(dt.getDate()+i);dates.push(dt.getDate())}
  let h='<div class="my-schedule card">';
  h+=`<div class="my-name">👋 ${st.name}</div>`;
  h+=`<div class="my-week">📅 ${fmtDate(ws)} - ${fmtDate(new Date(new Date(ws).getTime()+6*864e5))}</div>`;
  h+='<div class="day-row">';
  for(let i=0;i<7;i++){
    const shift=ss[DAY_KEYS[i]]||'';
    h+=`<div class="day-cell shift-${shift}"><div class="day-label">${DAYS[i]}<br><span style="font-weight:400;font-size:10px;color:#999">${dates[i]}日</span></div><div style="font-size:16px;font-weight:700;margin-top:4px">${shift||'-'}</div></div>`;
  }
  h+='</div></div>';
  // Share button
  const shareUrl = window.location.origin + '/share/' + encodeURIComponent(st.name);
  h+=`<div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn btn-primary" style="flex:1" onclick="copyUrl(window.location.origin+'/share/'+encodeURIComponent(st.name),'✅ 排班链接已复制，发到微信群即可')">📤 分享到微信</button>
    <button class="btn btn-outline" onclick="saveScreenshot()">📷 截图保存</button>
  </div>`;
  return h;
}

function selectMy(name){
  if(!name){state.searchName='';render();return}
  state.searchName=name;
  render();
}

async function loadWeek(){
  const v=$('#weekPicker').value;
  if(!v){toast('请选择日期');return}
  state.editingWeekStart=getMonday(v);
  await loadSchedules(state.editingWeekStart);
  await loadPublished();
  render();
}

function shareFullTeam(){
  const url = window.location.origin + '/share/full';
  copyUrl(url, '✅ 团队排班链接已复制，发到微信群即可');
}

function copyUrl(url, msg){
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>{toast(msg);}).catch(()=>{fallbackCopy(url,msg);});
  } else {fallbackCopy(url,msg);}
}

function fallbackCopy(url, msg){
  const ta = document.createElement('textarea');
  ta.value = url;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  toast(msg||'✅ 链接已复制');
}

function saveViewScreenshot(){
  const card = document.querySelector('.schedule-grid').parentElement;
  if(!card){toast('请先加载排班数据');return}
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  s.onload = async () => {
    try {
      const canvas = await html2canvas(card, {
        backgroundColor:'#fff', scale:2, useCORS:true
      });
      const link = document.createElement('a');
      link.download = '排班表_' + (state.editingWeekStart||'') + '.png';
      link.href = canvas.toDataURL();
      link.click();
      toast('✅ 排班截图已保存');
    } catch(e) {toast('截图失败: '+e.message);}
  };
  s.onerror = () => toast('加载截图库失败');
  document.head.append(s);
}

function exportExcel(){
  const ws = state.editingWeekStart;
  if(!ws){toast('请先选择周');return}
  window.open('/api/export/excel?week_start=' + ws, '_blank');
  toast('📥 正在下载 Excel');
}

function saveScreenshot(){
  // Use html2canvas to capture the schedule card
  const card = document.querySelector('.my-schedule');
  if(!card){toast('请先查询排班');return}
  // Load html2canvas dynamically
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  s.onload = async () => {
    try {
      const canvas = await html2canvas(card, {backgroundColor:'#fff', scale:2});
      const link = document.createElement('a');
      link.download = '排班_' + document.querySelector('.my-name')?.textContent?.trim()?.replace('👋','').trim() + '.png';
      link.href = canvas.toDataURL();
      link.click();
      toast('✅ 截图已保存');
    } catch(e) {
      toast('截图失败: '+e.message);
    }
  };
  s.onerror = () => toast('加载截图库失败');
  document.head.append(s);
}

// ----- Admin -----
function renderAdmin(){
  if(!state.isAdmin){
    return `<div class="password-screen"><h2>🔐 管理员登录</h2>
      <input type="password" id="adminPwdInput" placeholder="输入管理密码" onkeydown="if(event.key==='Enter')login()">
      <button class="btn btn-primary btn-block" onclick="login()" style="max-width:280px">登录</button></div>`;
  }
  let h='';
  // Week selector
  h+=`<div class="card"><h3>📅 选择排班周</h3><div class="week-picker">
    <input type="date" id="adminWeekPicker" value="${state.editingWeekStart||getNextMonday()}">
    <button class="btn btn-sm btn-primary" onclick="adminLoadWeek()">加载</button></div>`;
  
  const pub=state.publishedWeeks.find(p=>p.week_start===state.editingWeekStart);
  if(pub) h+=`<p style="color:#52c41a;font-size:13px">✅ 本周已发布 (${pub.published_at})</p>`;
  
  h+='</div>';
  
  // Action buttons
  h+='<div class="card"><h3>⚡ 排班操作</h3><div class="action-bar">';
  h+='<button class="btn btn-success" onclick="doAuto()">🤖 一键排班</button>';
  h+='<button class="btn btn-warning" onclick="doPublish()">📤 发布</button>';
  if(pub) h+='<button class="btn btn-danger" onclick="doUnpublish()">📥 取消发布</button>';
  h+='</div></div>';
  
  // Staff editor
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h3 style="margin:0">👥 员工管理</h3>
    <button class="btn btn-sm btn-primary" onclick="showAddStaff()">+ 添加</button>
  </div>`;
  h+='<div class="staff-list">';
  for(const s of state.staff){
    h+=`<div class="staff-item"><div class="staff-info">
      <span class="staff-name">${s.name}</span>
      <span class="staff-brand">${s.brand||''} ${s.role||''}</span>
    </div>
    <div><button class="btn btn-sm btn-outline" onclick="editStaff(${s.id},'${s.name}','${s.brand||''}','${s.role||''}')">✏️</button>
    <button class="btn btn-sm btn-danger" onclick="delStaff(${s.id})">🗑️</button></div></div>`;
  }
  h+='</div></div>';

  // Rules config card - visual tag-based UI
  h+=`<div class="card" id="rulesCard"><h3>📋 排班规则 <span style="font-size:12px;color:#999;font-weight:400">点击人员姓名配对分组</span></h3>
  <div id="rulesEditor">${renderRulesEditor()}</div></div>`;

  // Editable schedule grid
  if(state.schedules.length>0){
    h+='<div class="card"><h3>📝 编辑排班 (点击班次切换)</h3>';
    h+='<div class="schedule-grid"><table>';
    h+='<tr><th style="min-width:70px">姓名</th>';
    for(let i=0;i<7;i++) h+=`<th>${DAYS[i]}</th>`;
    h+='</tr>';
    
    for(const s of state.schedules){
      h+=`<tr><td class="name-col">${s.name}</td>`;
      const snap = state.scheduleSnapshot.find(x => x.id === s.id);
      for(let i=0;i<7;i++){
        const key=DAY_KEYS[i];
        const shift=s[key]||'';
        const orig = snap ? (snap[key]||'') : '';
        const changed = shift !== orig;
        h+=`<td class="shift-${shift}"><span class="shift-select${changed ? ' changed' : ''}" data-key="${key}" data-sid="${s.id}" data-day="${i}" onclick="cycleShift(${s.id},${i},this)">${shift||'-'}</span></td>`;
      }
      h+='</tr>';
    }
    h+='</table></div>';
    // Change summary
    const changeCount = state.schedules.reduce((cnt, s) => {
      const snap = state.scheduleSnapshot.find(x => x.id === s.id);
      if(!snap) return cnt;
      for(const k of DAY_KEYS){
        if((s[k]||'') !== (snap[k]||'')){cnt++; break;}
      }
      return cnt;
    }, 0);
    if(changeCount > 0){
      h+=`<div style="text-align:center;margin:8px 0;padding:6px 12px;background:#fff2f0;border:1px solid #ffccc7;border-radius:6px;font-size:13px;color:#cf1322">🔄 ${changeCount} 处待保存变更</div>`;
    }
    h+=`<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="saveEdits()">💾 保存修改</button>`;
    // Self-check panel
    h+=`<div id="selfCheckPanel" style="margin-top:12px"></div>`;
    h+='</div>';
  }
  
  return h;
}

function cycleShift(scheduleId, dayIdx, el){
  const s=state.schedules.find(x=>x.id===scheduleId);
  if(!s) return;
  const key=DAY_KEYS[dayIdx];
  const cur=s[key]||'';
  const idx=SHIFTS.indexOf(cur);
  const next=SHIFTS[(idx+1)%SHIFTS.length];
  s[key]=next;
  el.textContent=next;
  el.className='shift-select shift-'+next;
  
  // Mark as changed if different from original
  const snap = state.scheduleSnapshot.find(x => x.id === scheduleId);
  if(snap && next !== (snap[key]||'')){
    el.classList.add('changed');
  } else {
    el.classList.remove('changed');
  }

  // Run self-check after each change
  runSelfCheck();
}

function runSelfCheck(){
  const panel = document.getElementById('selfCheckPanel');
  if(!panel) return;
  const schedules = state.schedules;
  if(!schedules || schedules.length === 0){panel.innerHTML='';return}
  
  const staffCount = schedules.length; // 9
  const issues = [];
  const suggestions = [];
  
  // 1. Daily balance check: for each day, count 早/晚/休/全
  for(let d=0;d<7;d++){
    // 原则：周五周六周日全员不能休息，跳过检查
    if(d >= 4) continue;
    const key=DAY_KEYS[d];
    const counts = {早:0,晚:0,休:0,全:0};
    let totalWorking = 0;
    for(const s of schedules){
      const shift=s[key]||'';
      if(counts[shift]!==undefined) counts[shift]++;
      if(shift==='早'||shift==='晚') totalWorking++;
    }
    // Ideal: 9人, 1休 → 8人分早/晚, 约4早4晚
    const idealShift = Math.round(totalWorking/2);
    const diffs = [];
    if(Math.abs(counts['早'] - counts['晚']) > 1 && totalWorking > 2){
      diffs.push(`早${counts['早']}人 / 晚${counts['晚']}人 不均`);
    }
    if(counts['休'] !== 1){
      diffs.push(`休${counts['休']}人 (应为1人)`);
    }
    if(counts['全'] > 0){
      diffs.push(`全${counts['全']}人 (全仅周六)`);
    }
    if(diffs.length > 0){
      issues.push(`<strong>${DAYS[d]}</strong>: ${diffs.join('；')}`);
      suggestions.push(`<strong>${DAYS[d]}</strong>建议调整至 早${idealShift}晚${idealShift}休1 (周五六日不排休)`);
    }
  }
  
  // 2. Per-person weekly balance check
  for(const s of schedules){
    let 早Count=0, 晚Count=0, 休Count=0, 全Count=0;
    for(let d=0;d<7;d++){
      if(d >= 4) continue; // 周五六日不排休，不计入个人平衡统计
      const shift=s[DAY_KEYS[d]]||'';
      if(shift==='早')早Count++;
      else if(shift==='晚')晚Count++;
      else if(shift==='休')休Count++;
      else if(shift==='全')全Count++;
    }
    let personIssues = [];
    // Check 早/晚 balance: Mon-Thu = 4天, 1休, 剩3天; 全周(除休全)应有3早2晚
    // Check 早/晚 balance: Mon-Thu = 4天, 1休, 剩3天; 全周(除休全)应有3早2晚
    const totalShifts = 早Count+晚Count;
    if(休Count !== 1) personIssues.push(`休${休Count}天 (应恰1天)`);
    if(全Count > 0) personIssues.push(`非周六全${全Count}天 (全仅周六)`);
    // 全周目标: 3早2晚1休1全(周六)
    const 非休非全 = schedules.filter(x=>x.name===s.name)[0];
    if(非休非全){
      const all早 = ['mon_shift','tue_shift','wed_shift','thu_shift','fri_shift','sun_shift'].filter(k=>非休非全[k]==='早').length;
      const all晚 = ['mon_shift','tue_shift','wed_shift','thu_shift','fri_shift','sun_shift'].filter(k=>非休非全[k]==='晚').length;
      const expected = all早 + all晚; // 应为5
      if(all早 !== 3) personIssues.push(`早班${all早}天 (应为3天)`);
      if(all晚 !== 2) personIssues.push(`晚班${all晚}天 (应为2天)`);
    }
    if(personIssues.length > 0){
      issues.push(`<strong>${s.name}</strong>: ${personIssues.join('；')}`);
      suggestions.push(`<strong>${s.name}</strong>建议: 3早2晚1休 (周五六日全上班)`);
    }
  }
  
  // 3. Extra check: 周五周日不应有休/全
  for(const s of schedules){
    for(const d of [4, 6]){
      const shift = s[DAY_KEYS[d]] || '';
      if(shift === '休') issues.push(`<strong>${s.name}</strong>: ${DAYS[d]}不应排休`);
      if(shift === '全') issues.push(`<strong>${s.name}</strong>: ${DAYS[d]}不应排全 (全仅周六)`);
    }
  }
  
  // 4. 对班制检查
  for(let d=0;d<7;d++){
    if(d === 5) continue; // 周六全员全
    const key=DAY_KEYS[d];
    // 对班组检查: 一早一晚
    for(const pair of RULES.oppositePairs){
      const s0 = schedules.find(x => x.name === pair[0]);
      const s1 = schedules.find(x => x.name === pair[1]);
      if(!s0 || !s1) continue;
      const sh0 = s0[key]||'', sh1 = s1[key]||'';
      if(sh0 === '休' && sh1 === '休'){
        issues.push(`<strong>${DAYS[d]}</strong>: ${pair[0]}和${pair[1]}同时休息`);
      }
      if(sh0 !== '休' && sh1 !== '休' && sh0 === sh1){
        issues.push(`<strong>${DAYS[d]}</strong>: ${pair[0]}和${pair[1]}同为${sh0}，应一早一晚`);
      }
    }
    // 同班组检查: 同班次
    for(const pair of RULES.samePairs){
      const s0 = schedules.find(x => x.name === pair[0]);
      const s1 = schedules.find(x => x.name === pair[1]);
      if(!s0 || !s1) continue;
      const sh0 = s0[key]||'', sh1 = s1[key]||'';
      if(sh0 !== sh1 && sh0 !== '休' && sh1 !== '休'){
        issues.push(`<strong>${DAYS[d]}</strong>: ${pair[0]}(${sh0})和${pair[1]}(${sh1})应同班次`);
      }
    }
    // 平衡组检查: 组内早晚平衡，不得同时休息
    for(const team of RULES.balanceTeams){
      const memberShifts = team.map(n => {
        const s = schedules.find(x => x.name === n);
        return s ? (s[key]||'') : '';
      });
      const all休 = memberShifts.every(s => s === '休');
      if(all休) issues.push(`<strong>${DAYS[d]}</strong>: ${team.join('/')}同时休息`);
      const 早Count = memberShifts.filter(s => s==='早').length;
      const 晚Count = memberShifts.filter(s => s==='晚').length;
      const working = 早Count + 晚Count;
      if(working > 0 && Math.abs(早Count-晚Count) > 1){
        issues.push(`<strong>${DAYS[d]}</strong>: ${team.join('/')}早${早Count}晚${晚Count}不均衡`);
      }
    }
  }
  
  // Render panel
  if(issues.length === 0){
    panel.innerHTML='<div style="padding:10px 14px;background:#f6ffed;border:1px solid #b7eb8f;border-radius:8px;font-size:13px;color:#389e0d">✅ 排班检查通过，分布合理</div>';
    return;
  }
  
  let html='<div style="background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:12px;font-size:13px">';
  html+=`<div style="font-weight:600;color:#d48806;margin-bottom:8px">⚠️ 排班检查发现 ${issues.length} 个问题</div>`;
  html+='<ul style="margin:0 0 8px 0;padding-left:16px;line-height:1.8">';
  for(const iss of issues) html+=`<li style="color:#cf1322">${iss}</li>`;
  html+='</ul>';
  html+='<details style="margin-top:4px"><summary style="color:#d48806;cursor:pointer;font-weight:500">💡 查看调整建议</summary>';
  html+='<ul style="margin:6px 0 0 0;padding-left:16px;line-height:1.8">';
  for(const sug of suggestions) html+=`<li style="color:#389e0d">${sug}</li>`;
  html+='</ul></details>';
  html+=`<button class="btn btn-warning btn-block" style="margin-top:10px" onclick="autoFix()">🔧 一键修复 (${issues.length}个问题)</button>`;
  html+='</div>';
  panel.innerHTML=html;
}

function autoFix(){
  const schedules = state.schedules;
  if(!schedules || schedules.length === 0) return;

  // 原则：周五周六周日全员不能休息, 周六全员全班
  for(const s of schedules){
    s[DAY_KEYS[5]] = '全';    // 周六全
    if(s[DAY_KEYS[4]] === '休') s[DAY_KEYS[4]] = '早'; // 周五不排休
    if(s[DAY_KEYS[6]] === '休') s[DAY_KEYS[6]] = '早'; // 周日不排休
    if(s[DAY_KEYS[4]] === '全') s[DAY_KEYS[4]] = '早'; // 全只在周六
    if(s[DAY_KEYS[6]] === '全') s[DAY_KEYS[6]] = '早';
  }

  // ---- Phase 1: 同班组 (同班次 — 最高优先级) ----
  for(let d=0;d<7;d++){
    if(d === 5) continue; // 周六全员全跳过
    const key=DAY_KEYS[d];
    
    
    // 1. 同班组: 同班次 (优先执行)
    for(const pair of RULES.samePairs){
      const s0 = schedules.find(x => x.name === pair[0]);
      const s1 = schedules.find(x => x.name === pair[1]);
      if(!s0 || !s1) continue;
      const sh0 = s0[key]||'', sh1 = s1[key]||'';
      if(sh0 !== '休' && sh1 !== '休' && sh0 !== sh1){
        // 以第一个人的班次为准
        s1[key] = sh0;
      }
    }
    
    // 对班组: 一早一晚 (必须适用)
    for(const pair of RULES.oppositePairs){
      const s0 = schedules.find(x => x.name === pair[0]);
      const s1 = schedules.find(x => x.name === pair[1]);
      if(!s0 || !s1) continue;
      const sh0 = s0[key]||'', sh1 = s1[key]||'';
      if(sh0 === '休' && sh1 === '休'){
        s1[key] = '早';
      }
      if(sh0 !== '休' && sh1 !== '休' && sh0 === sh1){
        s1[key] = sh0 === '早' ? '晚' : '早';
      }
    }
    
  }

  // ---- Phase 2: Fix Mon-Thu to have exactly 1休 (no 全, 全只在周六) ----
  for(let d=0;d<4;d++){
    const key=DAY_KEYS[d];
    let 休People=[], 早People=[], 晚People=[];
    for(const s of schedules){
      const shift=s[key]||'';
      if(shift==='休') 休People.push(s);
      else if(shift==='全'){ s[key]='早'; 早People.push(s); } // 全→早
      else if(shift==='早') 早People.push(s);
      else if(shift==='晚') 晚People.push(s);
    }
    
    // Fix excess 休 → move to 早/晚
    while(休People.length > 1){
      const p = 休People.pop();
      p[key] = 早People.length <= 晚People.length ? '早' : '晚';
      (p[key]==='早' ? 早People : 晚People).push(p);
    }
    // Fix missing 休
    if(休People.length === 0){
      const pool = 早People.length >= 晚People.length ? 早People : 晚People;
      if(pool.length > 0){
        const p = pool.pop();
        p[key] = '休'; 休People.push(p);
      }
    }
    // Balance 早/晚
    早People=[]; 晚People=[];
    for(const s of schedules){
      const shift=s[key]||'';
      if(shift==='早') 早People.push(s);
      else if(shift==='晚') 晚People.push(s);
    }
    while(Math.abs(早People.length - 晚People.length) > 1 && 早People.length + 晚People.length > 2){
      if(早People.length > 晚People.length){
        早People.pop()[key] = '晚';
      } else {
        晚People.pop()[key] = '早';
      }
    }
  }
  
  // Bonus: Fix Fri/Sun to be balanced 早/晚
  for(const d of [4, 6]){
    const key=DAY_KEYS[d];
    let 早People=[], 晚People=[];
    for(const s of schedules){
      const shift=s[key]||'';
      if(shift==='早') 早People.push(s);
      else if(shift==='晚') 晚People.push(s);
    }
    while(Math.abs(早People.length - 晚People.length) > 1 && 早People.length + 晚People.length > 2){
      if(早People.length > 晚People.length){
        早People.pop()[key] = '晚';
      } else {
        晚People.pop()[key] = '早';
      }
    }
  }
  
  // ---- Phase 3: Fix each person - exactly 1休 (Mon-Thu only), 3早2晚1休1全 ----
  for(const s of schedules){
    let 休Days=[], 早Days=[], 晚Days=[];
    for(let d=0;d<7;d++){
      if(d >= 4) continue; // Fri/Sat/Sun: 休不可, 全只在周六
      const shift=s[DAY_KEYS[d]]||'';
      if(shift==='休') 休Days.push(d);
      else if(shift==='全'){ s[DAY_KEYS[d]]='早'; 早Days.push(d); } // 非周六全→早
      else if(shift==='早') 早Days.push(d);
      else if(shift==='晚') 晚Days.push(d);
    }
    
    // Fix excess 休
    while(休Days.length > 1){
      const day = 休Days.pop();
      const dayShifts = schedules.map(x=>x[DAY_KEYS[day]]||'');
      const 早C = dayShifts.filter(x=>x==='早').length;
      const 晚C = dayShifts.filter(x=>x==='晚').length;
      s[DAY_KEYS[day]] = 早C <= 晚C ? '早' : '晚';
      (s[DAY_KEYS[day]]==='早' ? 早Days : 晚Days).push(day);
    }
    // Fix missing 休
    if(休Days.length === 0){
      const pool = [...早Days,...晚Days];
      for(const day of pool){
        const day休 = schedules.filter(x=>x[DAY_KEYS[day]]==='休').length;
        if(day休 === 0){
          s[DAY_KEYS[day]] = '休'; 休Days.push(day); break;
        }
      }
      if(休Days.length === 0 && pool.length > 0){
        s[DAY_KEYS[pool[0]]] = '休'; 休Days.push(pool[0]);
      }
    }
    
    // ---- 调整为3早2晚 (针对非休非全的5天: Mon/ Tue/ Wed/ Thu工作 + Fri + Sun) ----
    // 先收集所有非休非全的天
    const workDays = [];
    for(let d=0;d<7;d++){
      if(d===5) continue; // 周六全跳过
      const shift=s[DAY_KEYS[d]]||'';
      if(shift!=='休' && shift!=='全' && shift!=='') workDays.push({d,shift});
    }
    let 早c = workDays.filter(x=>x.shift==='早').length;
    let 晚c = workDays.filter(x=>x.shift==='晚').length;
    const total = 早c+晚c; // 应为5
    if(total === 5 && (早c !== 3 || 晚c !== 2)){
      for(const w of workDays){
        if(早c > 3 && w.shift === '早'){
          s[DAY_KEYS[w.d]] = '晚'; 早c--; 晚c++;
        } else if(晚c > 2 && w.shift === '晚'){
          s[DAY_KEYS[w.d]] = '早'; 晚c--; 早c++;
        }
        if(早c===3 && 晚c===2) break;
      }
    }
  }
  
  // ---- Phase 4: 平衡组 (组内早晚均衡 — 最低优先级) ----
  for(let d=0;d<7;d++){
    if(d === 5) continue;
    const key=DAY_KEYS[d];
    for(const team of RULES.balanceTeams){
      const members = team.map(n => schedules.find(x => x.name === n)).filter(Boolean);
      if(members.length < 2) continue;
      const shifts = members.map(s => s ? (s[key]||'') : '');
      const withRest = shifts.filter(s => s === '休');
      // 不能全部休息
      if(withRest.length === members.length){
        for(let i=0;i<Math.ceil(members.length/2);i++){
          if(members[i][key] === '休') members[i][key] = '早';
        }
      }
      // 早晚平衡
      const workingMembers = members.filter(s => s[key] !== '休' && s[key] !== '');
      const cur早 = workingMembers.filter(s => s[key] === '早').length;
      const cur晚 = workingMembers.filter(s => s[key] === '晚').length;
      if(workingMembers.length >= 2 && Math.abs(cur早 - cur晚) > 1){
        if(cur早 > cur晚){
          const toSwap = workingMembers.filter(s => s[key] === '早');
          const need = Math.min(toSwap.length, Math.floor((cur早 - Math.round(workingMembers.length/2))));
          for(let i=0;i<need;i++) toSwap[i][key] = '晚';
        } else {
          const toSwap = workingMembers.filter(s => s[key] === '晚');
          const need = Math.min(toSwap.length, Math.floor((cur晚 - Math.round(workingMembers.length/2))));
          for(let i=0;i<need;i++) toSwap[i][key] = '早';
        }
      }
    }
  }
  
  // Re-render table and self-check
  // Update snapshot so changed markers reflect auto-fix
  state.scheduleSnapshot = state.schedules.map(s => ({
    id: s.id,
    mon_shift:s.mon_shift,tue_shift:s.tue_shift,wed_shift:s.wed_shift,
    thu_shift:s.thu_shift,fri_shift:s.fri_shift,sat_shift:s.sat_shift,sun_shift:s.sun_shift
  }));
  render();
  runSelfCheck();
  toast('🔧 已自动修复，请检查结果');
}

// ----- 排班规则编辑器 (可视化) -----
const RULE_COLORS = ['#e6f7ff','#fff7e6','#f6ffed','#f0f5ff','#fff0f6','#f9f0ff','#e6fffb','#ffe7ba'];
let ruleEditState = { type: null }; // which rule type is being edited

function renderRulesEditor(){
  const allNames = state.staff.map(s => s.name);
  let h='';
  
  // Helper: render groups for a rule type
  const renderGroups = (groups, typeKey, label, colorIdx) => {
    // Get assigned names
    const assigned = new Set();
    for(const g of groups) for(const n of g) assigned.add(n);
    const unassigned = allNames.filter(n => !assigned.has(n));
    
    h+=`<div style="margin-bottom:14px;border:1px solid #eee;border-radius:10px;padding:12px;background:#fafafa">
      <div style="font-weight:600;font-size:14px;margin-bottom:8px;color:#333">${label}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:32px">`;
    // Render existing groups
    for(let gi=0; gi<groups.length; gi++){
      const g = groups[gi];
      const bg = RULE_COLORS[(colorIdx + gi) % RULE_COLORS.length];
      h+=`<span style="display:inline-flex;align-items:center;gap:3px;background:${bg};border-radius:20px;padding:4px 10px;font-size:13px;border:1px solid #d9d9d9">`;
      h+=g.join(' · ');
      h+=`<span onclick="ruleRemoveGroup('${typeKey}',${gi})" style="cursor:pointer;opacity:.5;margin-left:2px;font-size:15px;line-height:1">&times;</span>`;
      h+=`</span>`;
    }
    if(groups.length === 0) h+=`<span style="color:#ccc;font-size:13px;padding:2px 0">暂无分组，点击下方人员配对</span>`;
    h+=`</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">`;
    // Render unassigned staff as clickable tags
    for(const n of unassigned){
      h+=`<span class="rule-tag rule-tag-avail" onclick="ruleClickName('${typeKey}','${n}')">${n}</span>`;
    }
    // Render assigned staff as "in use" tags (can still click to start new group)
    for(const g of groups){
      for(const n of g){
        h+=`<span class="rule-tag rule-tag-used" onclick="ruleClickName('${typeKey}','${n}')">${n}</span>`;
      }
    }
    h+=`</div>
    </div>`;
  };
  
  renderGroups(RULES.oppositePairs, 'oppositePairs', '对班组 (一早一晚) — 点击2人配成一组', 0);
  renderGroups(RULES.samePairs, 'samePairs', '同班组 (同班次) — 点击2人配成一组', 2);
  renderGroups(RULES.balanceTeams, 'balanceTeams', '平衡组 (组内早晚均衡) — 点击多人组成一组', 4);
  
  h+=`<button class="btn btn-sm btn-primary" onclick="saveRulesVisual()">💾 保存规则并重新检查</button>
  <button class="btn btn-sm btn-outline" onclick="ruleCancelEdit()" style="margin-left:8px">↩ 取消</button>`;
  
  return h;
}

let rulePending = []; // pending names being grouped

function ruleClickName(typeKey, name){
  // Initialize pending if starting fresh for this rule type
  if(ruleEditState.type !== typeKey){
    ruleEditState.type = typeKey;
    rulePending = [];
  }
  
  // Check if already in pending
  const idx = rulePending.indexOf(name);
  if(idx >= 0){
    rulePending.splice(idx, 1); // remove from pending
    $('#rulesEditor').innerHTML = renderRulesEditor();
    renderPendingBar();
    return;
  }
  
  // Check if already in an existing group
  const groups = RULES[typeKey];
  for(let gi=0; gi<groups.length; gi++){
    const fi = groups[gi].indexOf(name);
    if(fi >= 0){
      // Remove from existing group
      groups[gi].splice(fi, 1);
      if(groups[gi].length === 0) groups.splice(gi, 1);
      $('#rulesEditor').innerHTML = renderRulesEditor();
      renderPendingBar();
      return;
    }
  }
  
  // Add to pending
  rulePending.push(name);
  
  // Check if group is complete
  const maxSize = typeKey === 'balanceTeams' ? 99 : 2;
  if(rulePending.length >= maxSize){
    // Form a new group
    groups.push([...rulePending]);
    rulePending = [];
    ruleEditState.type = null;
  }
  
  $('#rulesEditor').innerHTML = renderRulesEditor();
  renderPendingBar();
}

function renderPendingBar(){
  // Show pending selection bar
  const editor = document.getElementById('rulesEditor');
  if(!editor) return;
  if(rulePending.length === 0){
    // Remove existing pending bar if any
    const old = document.getElementById('rulePendingBar');
    if(old) old.remove();
    return;
  }
  let old = document.getElementById('rulePendingBar');
  if(!old){
    old = document.createElement('div');
    old.id = 'rulePendingBar';
    old.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px';
    document.body.append(old);
  }
  const typeLabel = ruleEditState.type === 'oppositePairs' ? '对班组' : ruleEditState.type === 'samePairs' ? '同班组' : '平衡组';
  old.innerHTML = `${typeLabel} 已选: <strong>${rulePending.join(' · ')}</strong>
    <span style="opacity:.7;margin-left:4px">${ruleEditState.type === 'balanceTeams' ? '继续点击添加更多人，或' : ''}还需${ruleEditState.type === 'balanceTeams' ? '1+' : '1'}人</span>
    <span onclick="ruleCancelPending()" style="cursor:pointer;margin-left:8px;background:#666;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:14px">&times;</span>`;
}

function ruleCancelPending(){
  rulePending = [];
  ruleEditState.type = null;
  const bar = document.getElementById('rulePendingBar');
  if(bar) bar.remove();
  $('#rulesEditor').innerHTML = renderRulesEditor();
}

function ruleRemoveGroup(typeKey, gi){
  RULES[typeKey].splice(gi, 1);
  $('#rulesEditor').innerHTML = renderRulesEditor();
}

function ruleCancelEdit(){
  rulePending = [];
  ruleEditState.type = null;
  const bar = document.getElementById('rulePendingBar');
  if(bar) bar.remove();
  $('#rulesEditor').innerHTML = renderRulesEditor();
}

function saveRulesVisual(){
  rulePending = [];
  ruleEditState.type = null;
  const bar = document.getElementById('rulePendingBar');
  if(bar) bar.remove();
  toast('✅ 规则已保存');
  runSelfCheck();
}

async function saveEdits(){
  const ws=state.editingWeekStart;
  if(!ws){toast('请先选择周');return}
  const items=state.schedules.map(s=>({
    staff_id:s.staff_id,
    mon_shift:s.mon_shift,tue_shift:s.tue_shift,wed_shift:s.wed_shift,
    thu_shift:s.thu_shift,fri_shift:s.fri_shift,sat_shift:s.sat_shift,sun_shift:s.sun_shift
  }));
  await api('PUT','/api/schedules',{week_start:ws,schedules:items});
  // Refresh snapshot so changed markers reset
  state.scheduleSnapshot = state.schedules.map(s => ({
    id: s.id,
    mon_shift:s.mon_shift,tue_shift:s.tue_shift,wed_shift:s.wed_shift,
    thu_shift:s.thu_shift,fri_shift:s.fri_shift,sat_shift:s.sat_shift,sun_shift:s.sun_shift
  }));
  render();
  setTimeout(()=>runSelfCheck(),50);
  toast('✅ 已保存');
}

async function doAuto(){
  const ws=$('#adminWeekPicker').value||getNextMonday();
  state.editingWeekStart=getMonday(ws);
  toast('一键排班中...');
  await api('POST','/api/schedules/auto',{week_start:state.editingWeekStart});
  await loadSchedules(state.editingWeekStart);
  await loadPublished();
  render();
  setTimeout(()=>runSelfCheck(),50);
  toast('✅ 排班完成，可手动微调');
}

async function doPublish(){
  const ws=state.editingWeekStart;
  if(!ws){toast('请先选择周');return}
  if(state.schedules.length===0){toast('请先排班');return}
  await api('POST','/api/publish',{week_start:ws});
  await loadPublished();
  render();
  toast('✅ 已发布，同事可查看');
}

async function doUnpublish(){
  const ws=state.editingWeekStart;
  await api('DELETE',`/api/publish/${ws}`);
  await loadPublished();
  render();
  toast('已取消发布');
}

async function adminLoadWeek(){
  const v=$('#adminWeekPicker').value;
  if(!v){toast('请选择日期');return}
  state.editingWeekStart=getMonday(v);
  await loadSchedules(state.editingWeekStart);
  await loadPublished();
  render();
  setTimeout(()=>runSelfCheck(),50);
  toast('已加载');
}

// ----- Modal -----
let modalCallback=null;
function showModal(title,body,onOk){
  const overlay=el('div',{class:'modal'});
  const content=el('div',{class:'modal-content'});
  content.innerHTML=`<h3>${title}</h3>${body}<div class="form-actions"><button class="btn btn-outline" id="modalCancel">取消</button><button class="btn btn-primary" id="modalOk">确定</button></div>`;
  overlay.append(content);
  document.body.append(overlay);
  modalCallback=onOk;
  $('#modalCancel').onclick=()=>{overlay.remove();modalCallback=null};
  $('#modalOk').onclick=async ()=>{
    if(modalCallback){
      const r=await modalCallback();
      if(r===false) return;
    }
    overlay.remove();modalCallback=null;
  };
  overlay.onclick=(e)=>{if(e.target===overlay){overlay.remove();modalCallback=null}};
  // focus first input
  const fi=content.querySelector('input');if(fi)setTimeout(()=>fi.focus(),100);
}

// ----- Init -----
async function init(){
  // check admin session
  if(sessionStorage.getItem('admin_pwd')){
    const r=await api('POST','/api/check_password',{password:sessionStorage.getItem('admin_pwd')});
    if(r.ok) state.isAdmin=true;
    else sessionStorage.removeItem('admin_pwd');
  }
  
  await loadStaff();
  await loadPublished();
  
  // default: show latest published week
  if(state.publishedWeeks.length>0){
    state.editingWeekStart=state.publishedWeeks.sort((a,b)=>b.week_start.localeCompare(a.week_start))[0].week_start;
  } else {
    state.editingWeekStart=getNextMonday();
  }
  await loadSchedules(state.editingWeekStart);
  
  $('#headerSub').textContent=`${state.staff.length}人 · 南汇店`;
  render();
}

init();
</script>
